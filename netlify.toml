[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# A planilha de produtos passa pela função "planilha" (mesmo endereço do site,
# sem bloqueio do navegador). Precisa vir ANTES da regra geral: vale a primeira que combinar.
[[redirects]]
  from = "/api/planilha"
  to = "/.netlify/functions/planilha"
  status = 200
  force = true

# Arquivos gerados no build (páginas de produto com prévia própria) têm prioridade;
# qualquer outro endereço abre o site, que cuida da rota.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
