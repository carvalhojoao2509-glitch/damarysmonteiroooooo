[build]
  command = "npm run build"
  publish = "dist"

# Arquivos gerados no build (páginas de produto) têm prioridade; o resto abre o site.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
